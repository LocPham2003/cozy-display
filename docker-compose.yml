services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartcalendar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json
    depends_on:
      - db

volumes:
  postgres_data:
