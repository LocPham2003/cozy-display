<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        h1 {
            color: #1db954;
        }
        .container {
            display: flex;
            align-items: center;
            flex-direction: column;
            background: #282828;
            border-radius: 8px;
            padding: 40px;
        }
        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            height: 40px;
            margin: 10px;
            padding: 0 10px;
            background: grey;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Spotify</h1>
    <div class="container">
        <a href="/spotify/curr_playback/" class="button">Show currently playing track</a>
        <a href="/spotify/progress/" class="button">Show progress of currently playing track</a>
    </div>
</body>
</html>
