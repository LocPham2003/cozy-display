<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f1f3f4;
        }
        h1 {
            color: #1a73e8;
        }
        .container {
            display: flex;
            align-items: center;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            padding: 40px;
        }
        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            height: 40px;
            margin: 10px;
            padding: 0 10px;
            background: grey;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Calendar API</h1>
    <div class="container">
        <a href="/calendar/" class="button">Google Calendar</a>
        <a href="/spotify/" class="button">Spotify</a>
    </div>
</body>
</html>
